<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#04101e">
<title>Acuario evolutivo</title>
<style>
html,body{margin:0;height:100%;background:#020812;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas#c{position:fixed;inset:0;width:100vw;height:100vh;image-rendering:pixelated;image-rendering:crisp-edges}
*{box-sizing:border-box}
.px{font-family:ui-monospace,"Courier New",monospace;color:#e8f4ef;letter-spacing:.02em}
#hud{position:fixed;left:calc(env(safe-area-inset-left) + 12px);top:calc(env(safe-area-inset-top) + 10px);font-size:12px;line-height:1.5;text-shadow:1px 1px 0 #000,0 0 6px rgba(0,0,0,.6);pointer-events:none;z-index:3}
#hud b{color:#7fe0c8;font-weight:normal;letter-spacing:.1em;text-transform:uppercase}
#hud .bat{display:inline-block;width:22px;height:9px;border:1px solid #9fd;vertical-align:-1px;position:relative;margin-right:4px}
#hud .bat i{position:absolute;left:1px;top:1px;bottom:1px;background:#7fe0c8}
#hud .bat:after{content:"";position:absolute;right:-3px;top:2px;width:2px;height:3px;background:#9fd}
#map{position:fixed;left:calc(env(safe-area-inset-left) + 12px);bottom:calc(env(safe-area-inset-bottom) + 12px);width:min(46vw,260px);height:min(13vw,64px);border:1px solid rgba(127,224,200,.45);background:rgba(2,12,22,.55);image-rendering:pixelated;z-index:3;cursor:pointer}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 64px);width:min(86vw,370px);transform:translate(-50%,-14px);opacity:0;pointer-events:none;transition:opacity .6s,transform .6s;background:rgba(3,14,26,.86);border:2px solid #7fe0c8;box-shadow:4px 4px 0 rgba(0,0,0,.45);padding:12px 14px;font-size:13px;line-height:1.45;z-index:5}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast h3{margin:0 0 6px;font-size:12px;color:#7fe0c8;text-transform:uppercase;letter-spacing:.12em}
#toast .l{margin:2px 0}#toast .n{color:#ffd77a}#toast .x{color:#ff8f8f}#toast .a{color:#9fd8ff}
#scan{position:fixed;right:calc(env(safe-area-inset-right) + 12px);bottom:calc(env(safe-area-inset-bottom) + 12px);width:min(70vw,250px);background:rgba(3,14,26,.88);border:2px solid #7fe0c8;padding:10px 12px;font-size:12px;line-height:1.45;z-index:6;display:none}
#scan.on{display:block}
#scan .hd{display:flex;gap:8px;align-items:center;margin-bottom:6px}
#scan img{width:44px;max-height:34px;object-fit:contain;image-rendering:pixelated}
#scan b{color:#ffe9a8;display:block}
#scan .k{opacity:.7}
#scan button{margin-top:8px;width:100%}
#hint{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 90px);left:0;right:0;text-align:center;font-size:12px;opacity:.8;pointer-events:none;transition:opacity 1s;text-shadow:1px 1px 0 #000;z-index:3}
#ff{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:50%;transform:translateX(-50%);font-size:12px;color:#7fe0c8;opacity:0;transition:opacity .4s;text-shadow:1px 1px 0 #000;z-index:4}
#hud,#map{display:none!important}
body.wall #toast,body.wall #scan,body.wall #hint,body.wall #ff,body.wall #menuBtn{display:none!important}
body.app #hint,body.app #menuBtn,body.app #ff{display:none!important}
#menuBtn{position:fixed;top:calc(env(safe-area-inset-top) + 6px);right:8px;width:38px;height:38px;border:0;background:transparent;color:#9fd;font-size:20px;opacity:.5;z-index:4}
#panel{position:fixed;inset:0;background:rgba(2,9,18,.94);z-index:10;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 12px)}
#panel.on{display:flex}
#panel>*{width:100%;max-width:720px;margin-left:auto;margin-right:auto}
#tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
#tabs button,.btn{flex:1;font:inherit;font-size:12px;color:#cfe;background:#0b2233;border:2px solid #1f4b5e;padding:8px 4px;text-transform:uppercase;letter-spacing:.08em;cursor:pointer}
#tabs button.on{border-color:#7fe0c8;color:#7fe0c8;background:#0e2e3a}
#close{flex:0 0 42px!important}
#body{flex:1;overflow:auto;font-size:13px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.grp{margin:14px 0 4px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#7fe0c8}
.sp{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px dashed #163244;white-space:nowrap}
.sp img{width:34px;max-height:26px;object-fit:contain;image-rendering:pixelated;flex:0 0 auto}
.sp .t{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.sp b{font-size:12px;color:#ffe9a8;overflow:hidden;text-overflow:ellipsis}
.sp span{font-size:11px;opacity:.75;overflow:hidden;text-overflow:ellipsis}
.sp em{margin-left:auto;font-style:normal;font-size:11px;color:#7fe0c8;padding-left:6px}
.sp.ext{opacity:.5}.sp.ext em{color:#ff9d9d}
.br{color:#2d6075;flex:0 0 auto}
.lg{padding:5px 0;border-bottom:1px dashed #163244;line-height:1.4}
.lg time{display:block;font-size:10px;opacity:.55}
.st{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.st div{background:#0b2233;border:2px solid #1f4b5e;padding:10px}
.st b{display:block;font-size:20px;color:#ffe9a8}
.st small{opacity:.7;font-size:11px}
.bio{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed #163244;font-size:12px}
.bio i{width:12px;height:12px;flex:0 0 12px}
.bio span{flex:1}
.bio button{flex:0 0 64px;padding:5px 2px}
.pop{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12px}
.pop img{width:30px;max-height:22px;object-fit:contain;image-rendering:pixelated}
.pop .bar{flex:1;height:8px;background:#0b2233;border:1px solid #1f4b5e}
.pop .bar i{display:block;height:100%;background:#7fe0c8}
.pop span{width:120px}
.row{display:flex;gap:6px;margin:8px 0}.row input{flex:1;font:inherit;font-size:13px;background:#06141f;color:#e8f4ef;border:2px solid #1f4b5e;padding:8px}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}.modes button.on,.btn.on{border-color:#ffd77a;color:#ffd77a}
.wx{font-size:15px;color:#ffe9a8;margin:6px 0}
p.note{font-size:12px;opacity:.75;line-height:1.5}
</style>
</head>
<body class="px">
<canvas id="c"></canvas>
<div id="hud" class="px"></div>
<canvas id="map"></canvas>
<div id="ff" class="px">⏩ poniéndose al día…</div>
<div id="toast" class="px"></div>
<div id="scan" class="px"></div>
<div id="hint" class="px">clic en un bicho para escanearlo · clic en el agua para soltar comida · arrastra para mover la cámara · mantén pulsado para el panel</div>
<button id="menuBtn" class="px" aria-label="menú">☰</button>
<div id="panel" class="px">
  <div id="tabs">
    <button data-t="mapa" class="on">Mapa</button>
    <button data-t="arbol">Árbol</button>
    <button data-t="diario">Diario</button>
    <button data-t="tiempo">Tiempo</button>
    <button id="close">✕</button>
  </div>
  <div id="body"></div>
</div>
<script>
(()=>{
"use strict";

/* ================= utilidades ================= */
const $=s=>document.querySelector(s);
const view=$('#c'),vctx=view.getContext('2d');
const cv=document.createElement('canvas'),ctx=cv.getContext('2d');
const WALL=/fondo|wallpaper/.test(location.search+location.hash);
if(WALL)document.body.classList.add('wall');
if(/ajustes/.test(location.hash))document.body.classList.add('app');
const NOPANEL=/nopanel/.test(location.hash),NOSAVE=/preview/.test(location.hash);
const rnd=Math.random,R=(a,b)=>a+rnd()*(b-a),RI=n=>Math.floor(rnd()*n),clamp=(v,a,b)=>v<a?a:v>b?b:v;
const gauss=()=>(rnd()+rnd()+rnd()-1.5)*1.15,pick=a=>a[RI(a.length)],lerp=(a,b,t)=>a+(b-a)*t;
const smooth=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
let W=320,H=200,S=3;

/* ================= el mundo ================= */
const BIOMES=[
  {id:'manglar',  nm:'Manglar',             w:380,floor:62, temp:.10,tint:[64,118,86], deep:[10,30,24], prod:1.3,col:'#5fae6e'},
  {id:'arrecife', nm:'Arrecife de coral',   w:460,floor:140,temp:.02,tint:[44,176,196],deep:[8,40,70],  prod:1.0,col:'#ff8a6b'},
  {id:'posidonia',nm:'Pradera de posidonia',w:400,floor:112,temp:.30,tint:[48,150,176],deep:[8,36,64],  prod:1.0,col:'#7fcf7f'},
  {id:'naufragio',nm:'Naufragio',           w:360,floor:230,temp:.42,tint:[40,120,150],deep:[6,26,50],  prod:.8, col:'#c9a36b'},
  {id:'kelp',     nm:'Bosque de kelp',      w:460,floor:280,temp:.62,tint:[40,122,118],deep:[5,28,34],  prod:1.4,col:'#3f9a5a'},
  {id:'abierto',  nm:'Mar abierto',         w:560,floor:660,temp:.50,tint:[22,96,178], deep:[2,10,34],  prod:.7, col:'#4f8fe0'},
  {id:'abismo',   nm:'Fosa abisal',         w:460,floor:1160,temp:.55,tint:[14,54,110],deep:[1,3,10],  prod:.45,col:'#8a6bff'},
  {id:'polar',    nm:'Mar polar',           w:500,floor:390,temp:.95,tint:[80,140,168],deep:[6,20,34],  prod:1.6,col:'#bfe6ff'},
];
let WORLD_W=0;BIOMES.forEach((b,i)=>{b.i=i;b.x0=WORLD_W;WORLD_W+=b.w;b.x1=WORLD_W;b.cx=(b.x0+b.x1)/2;});
const WORLD_H=1200,TY0=-60,BT=80;
const BI=Object.fromEntries(BIOMES.map(b=>[b.id,b]));
function biomeIdx(x){for(const b of BIOMES)if(x<b.x1)return b.i;return BIOMES.length-1;}
function biomeBlend(x){
  const i=biomeIdx(x),b=BIOMES[i];
  if(x-b.x0<BT&&i>0)return {i:i-1,j:i,t:smooth(.5+.5*(x-b.x0)/BT)};
  if(b.x1-x<BT&&i<BIOMES.length-1)return {i:i+1,j:i,t:smooth(.5+.5*(b.x1-x)/BT)};
  return {i,j:i,t:1};
}
const floorArr=new Float32Array(WORLD_W+2);
(function(){
  for(let x=0;x<=WORLD_W+1;x++){
    const {i,j,t}=biomeBlend(x);let f=lerp(BIOMES[i].floor,BIOMES[j].floor,t);
    const d=f/400;
    f+=Math.sin(x*.031)*5+Math.sin(x*.113)*2.2+Math.sin(x*.0071)*10*Math.min(1,d)+Math.sin(x*.21)*1.2;
    if(x<110)f=lerp(-12,f,smooth(x/110));
    if(x>WORLD_W-24)f=lerp(f,-10,smooth((x-(WORLD_W-24))/24));
    floorArr[x]=f;
  }
})();
const floorAt=x=>floorArr[clamp(x|0,0,WORLD_W)];
let MINX=0,MAXX=WORLD_W;
for(let x=0;x<WORLD_W;x++)if(floorAt(x)>16){MINX=x+2;break;}
for(let x=WORLD_W;x>0;x--)if(floorAt(x)>16){MAXX=x-2;break;}
let tempOff=0;
function tempAt(x,y){const {i,j,t}=biomeBlend(x);const bt=lerp(BIOMES[i].temp,BIOMES[j].temp,t);const d=clamp(y/900,0,1);return clamp(lerp(bt,.85,d*d*.85+d*.15)+tempOff,0,1);}
const lightAt=y=>Math.exp(-Math.max(0,y)/185);
// hielo polar
// el borde del hielo se mueve con las estaciones (ver season()); los agujeros están fijos
const POL=BI.polar,ICE_BASE=POL.x0+50,ICE1=WORLD_W;let ICE0=ICE_BASE;
const HOLES=[[.12,26],[.34,20],[.56,30],[.8,22]].map(([f,w])=>{const c=ICE_BASE+(ICE1-ICE_BASE)*f;return [c-w/2,c+w/2];});
const iceAt=x=>x>=ICE0&&x<=ICE1&&!HOLES.some(h=>x>=h[0]&&x<=h[1]);
function nearestHole(x){let best=ICE0-8,bd=Math.abs(ICE0-8-x);for(const h of HOLES){if(h[1]<ICE0)continue;const c=(h[0]+h[1])/2,d=Math.abs(c-x);if(d<bd){bd=d;best=c;}}return best;}
function breathX(x){return iceAt(x)?nearestHole(x):x;}
// cuevas de morena y fumarolas (se rellenan al construir el terreno)
const DENS=[],VENTS=[];

/* ================= rejilla espacial ================= */
const CELL=48,GW=Math.ceil(WORLD_W/CELL)+1,GH=Math.ceil((WORLD_H-TY0)/CELL)+1;
const headC=new Int32Array(GW*GH),headF=new Int32Array(GW*GH);
let nextC=new Int32Array(2048),nextF=new Int32Array(8192);
const cellOf=(x,y)=>clamp(x/CELL|0,0,GW-1)+clamp((y-TY0)/CELL|0,0,GH-1)*GW;
function buildGrid(cr,food){
  headC.fill(-1);headF.fill(-1);
  if(nextC.length<cr.length)nextC=new Int32Array(cr.length*2);
  if(nextF.length<food.length)nextF=new Int32Array(food.length*2);
  for(let i=0;i<cr.length;i++){const k=cellOf(cr[i].x,cr[i].y);nextC[i]=headC[k];headC[k]=i;}
  for(let i=0;i<food.length;i++){const k=cellOf(food[i].x,food[i].y);nextF[i]=headF[k];headF[k]=i;}
}
function near(head,next,x,y,r,cb){
  const x0=clamp((x-r)/CELL|0,0,GW-1),x1=clamp((x+r)/CELL|0,0,GW-1),y0=clamp((y-r-TY0)/CELL|0,0,GH-1),y1=clamp((y+r-TY0)/CELL|0,0,GH-1);
  for(let gy=y0;gy<=y1;gy++)for(let gx=x0;gx<=x1;gx++)for(let i=head[gx+gy*GW];i>=0;i=next[i])cb(i);
}

/* ================= genes y planes corporales ================= */
const BASE={hue:[0,360,14,1],sat:[.1,1,.05],lum:[.3,.72,.03],size:[1.5,17,.2],len:[1,6,.06],speed:[.5,34,1.2],
  glow:[0,1,.05],diet:[0,1,.06],depth:[0,1,.05],temp:[0,1,.035],life:[150,9000,20],fert:[.55,.95,.03]};
const DISC={fin:[4,.05],pat:[4,.05],eye:[3,.04]};
const PLANS={
  fish:   {nm:'Peces',noun:'pez',rng:{size:[1.8,5.5],len:[1.3,2.5],speed:[8,30],life:[400,1100]},starve:110,emax:40,cap:280,group:8,cd:22,lat:['ichthys','ius','ops','ella','odon','ix']},
  seahorse:{nm:'Caballitos de mar',noun:'caballito',rng:{size:[2,4],len:[1.6,2.2],speed:[2,5],life:[700,1400]},starve:1400,emax:30,cap:30,group:5,lat:['hippus','campus','ippe']},
  squid:  {nm:'Calamares y sepias',noun:'calamar',rng:{size:[2.5,9],len:[1.8,2.6],speed:[10,30],life:[400,900]},starve:260,emax:50,cap:24,group:4,cd:16,lat:['teuthis','loligo','sepia']},
  octopus:{nm:'Pulpos',noun:'pulpo',rng:{size:[3,6],len:[1,1.4],speed:[6,18],life:[800,1500]},starve:420,emax:80,cap:12,group:1,cd:20,lat:['octopus','pus','poda']},
  crab:   {nm:'Cangrejos',noun:'cangrejo',rng:{size:[3,5.5],len:[1.4,2],speed:[4,11],life:[600,1200]},starve:340,emax:60,cap:40,group:5,lat:['carcinus','cancer','grapsus']},
  urchin: {nm:'Erizos',noun:'erizo',rng:{size:[2,3.5],len:[1,1.05],speed:[.6,1.6],life:[900,1800]},starve:900,emax:25,cap:40,group:8,lat:['echinus','cidaris','arbacia']},
  jelly:  {nm:'Medusas',noun:'medusa',rng:{size:[3,6.5],len:[1,1.8],speed:[3,7],life:[400,800]},starve:1800,emax:50,cap:30,group:4,cd:30,lat:['medusa','aurelia','cnidia']},
  ray:    {nm:'Rayas',noun:'raya',rng:{size:[3,5],len:[2,3],speed:[6,14],life:[800,1400]},starve:360,emax:120,cap:10,group:2,cd:20,lat:['batis','raja','myla']},
  moray:  {nm:'Morenas',noun:'morena',rng:{size:[2.5,4],len:[4,6],speed:[10,18],life:[2000,3500]},starve:2500,emax:120,cap:10,group:1,cd:30,lat:['muraena','gymnothorax','ophis']},
  angler: {nm:'Rapes abisales',noun:'rape',rng:{size:[3,7],len:[1.1,1.5],speed:[1.5,5],life:[1500,3000],glow:[.8,1]},starve:3000,emax:120,cap:12,group:2,cd:30,lat:['lophius','melanocetus','ceratias']},
  turtle: {nm:'Tortugas',noun:'tortuga',rng:{size:[5,7],len:[1.4,1.7],speed:[6,11],life:[2000,3500]},starve:1500,emax:300,cap:6,group:2,cd:14,breath:200,slow:1,lat:['chelys','emys','testudo']},
  otter:  {nm:'Nutrias marinas',noun:'nutria',rng:{size:[3,4.5],len:[2,2.6],speed:[8,16],life:[2000,3500]},starve:800,emax:90,cap:8,group:3,cd:10,breath:70,slow:1,lat:['enhydra','lutra','phoca']},
  penguin:{nm:'Pingüinos',noun:'pingüino',rng:{size:[3,4.5],len:[1.8,2.4],speed:[16,30],life:[1500,3000]},starve:420,emax:80,cap:16,group:5,cd:12,breath:120,slow:1,lat:['spheniscus','pygoscelis','eudyptes']},
  seal:   {nm:'Focas',noun:'foca',rng:{size:[4,6],len:[2.2,2.8],speed:[14,26],life:[2500,4000]},starve:700,emax:200,cap:8,group:2,cd:20,breath:240,slow:1,lat:['phoca','leptonyx','halichoerus']},
  shark:  {nm:'Tiburones',noun:'tiburón',rng:{size:[5,8],len:[2.8,3.4],speed:[15,28],life:[900,1600],sat:[.05,.35]},starve:1500,emax:300,cap:8,group:2,cd:45,slow:1,lat:['selachus','carcharias','odus']},
  orca:   {nm:'Orcas',noun:'orca',rng:{size:[8,11],len:[3,3.6],speed:[16,26],life:[5000,8000],sat:[0,.1]},starve:3000,emax:900,cap:4,group:3,cd:60,breath:260,slow:1,lat:['orcinus','grampus','orca']},
  whale:  {nm:'Ballenas',noun:'ballena',rng:{size:[13,17],len:[3.4,4],speed:[4,8],life:[6000,9000],sat:[.05,.35]},starve:3500,emax:1200,cap:4,group:1,breath:260,slow:1,visitor:1,lat:['cetus','balaena','physa']},
};
const ORDER=['fish','seahorse','squid','octopus','crab','urchin','jelly','ray','moray','angler','turtle','otter','penguin','seal','shark','orca','whale'];
const FLOOR_PLANS=new Set(['crab','urchin','octopus']);
const BREATHERS=new Set(['turtle','otter','penguin','seal','orca','whale']);
const rngOf=(plan,k)=>(PLANS[plan].rng[k])||BASE[k];
function randGenome(plan,over){
  const g={};
  for(const k in BASE){const [a,b]=rngOf(plan,k);g[k]=lerp(a,b,R(.2,.8));}
  g.hue=R(0,360);g.glow=R(0,.2);g.diet=plan==='fish'?R(0,.2):0;
  for(const k in DISC)g[k]=RI(DISC[k][0]);
  const D={squid:{hue:R(330,380)},crab:{hue:R(-20,35),sat:R(.6,.9)},urchin:{hue:R(260,320),sat:R(.3,.6),lum:R(.3,.4)},jelly:{hue:R(180,330),glow:R(.2,.7)},
    ray:{hue:R(20,45),sat:R(.2,.5)},turtle:{hue:R(70,130),sat:R(.3,.6)},shark:{hue:R(190,225),sat:R(.1,.3),lum:R(.4,.55)},whale:{hue:R(200,230),sat:R(.1,.3),lum:R(.34,.46)},
    seahorse:{hue:R(30,60),sat:R(.6,.9)},octopus:{hue:R(0,25),sat:R(.5,.8)},moray:{hue:R(60,90),sat:R(.4,.7),lum:R(.35,.5),pat:2},angler:{hue:R(15,35),sat:R(.2,.4),lum:R(.25,.35),glow:R(.85,1)},
    otter:{hue:R(20,32),sat:R(.35,.5),lum:R(.32,.42)},penguin:{hue:210,sat:.1,lum:.2},seal:{hue:R(200,220),sat:R(.05,.15),lum:R(.4,.55),pat:2},orca:{hue:220,sat:.05,lum:.12}}[plan];
  if(D)Object.assign(g,D);
  g.hue=((g.hue%360)+360)%360;
  return Object.assign(g,over||{});
}
function mutate(p,plan){
  const g={...p};
  for(const k in BASE){
    if(k==='diet'&&plan!=='fish')continue;
    if(rnd()<.3){const [a,b]=rngOf(plan,k),sd=PLANS[plan].rng[k]?(b-a)*.045:BASE[k][2];
      g[k]+=gauss()*sd*(rnd()<.03?4:1);
      g[k]=BASE[k][3]?((g[k]%360)+360)%360:clamp(g[k],a,b);}
  }
  for(const k in DISC)if(rnd()<DISC[k][1])g[k]=RI(DISC[k][0]);
  return g;
}
function dist(a,b,plan){
  let d=0;

  if(g.lum>.62&&g.sat<.45)return 'pálido';

  return h<15||h>=345?'rojo':h<40?'naranja':h<65?'dorado':h<150?'verde':h<190?'turquesa':h<250?'azul':h<290?'violeta':'rosa';

function epithet(g,plan){

  if(plan==='fish'&&g.diet>.6)o.push('voracis','mordax','ferox');
  if(rel(g,plan,'size')>.8)o.push('magnus','titanicus');
  if(rel(g,plan,'size')<.2)o.push('minimus','pusillus');
  if(rel(g,plan,'speed')>.8)o.push('velox','fugax');
  if(g.pat===1)o.push('striatus','tigrinus');
  if(g.pat===2)o.push('maculatus','punctatus');
  if(g.depth>.7)o.push('abyssalis','profundus','tenebrosus');
  if(g.temp>.8)o.push('glacialis','borealis','antarcticus');
  if(g.temp<.12)o.push('tropicalis','calidus');
  if(rel(g,plan,'life')>.85)o.push('longaevus');
  if(!o.length)o.push('vulgaris','communis','modestus','placidus','errans');

function pruneSpecies(){

  st.sp.filter(s=>s.extinct).sort((a,b)=>b.extinct-a.extinct).slice(0,120).forEach(s=>keep.add(s.id));

let catchQ=null;const CATCHUP=false;

  // sin puesta al día: el mar sigue justo donde lo dejaste
  if(!CATCHUP){if(st)st.t=to;return;}
  let total=(to-from)/1000;if(total<=0)return;
  const MAXSIM=6*3600;if(total>MAXSIM){from=to-MAXSIM*1000;total=MAXSIM;}
  const steps=Math.min(3000,Math.ceil(total/.5));
  catchQ={t:from,h:total/steps*1000,left:steps};
  $('#ff').style.opacity=1;
}
function runCatchUp(){
  const t0=performance.now();LIVE=false;
  while(catchQ&&performance.now()-t0<14){
    catchQ.t+=catchQ.h;step(catchQ.h/1000,catchQ.t);
    if(--catchQ.left<=0){catchQ=null;$('#ff').style.opacity=0;showSummary();save();}
  }
  LIVE=true;
}

    const node=(s,dep)=>{if(count++>700)return;const ind=Math.min(dep,9);
      const tag=s.extinct?(s.left?'se fue':'† '+fmtDate(s.extinct)):s.alive+' vivos';
      out+=`<div class="sp ${s.extinct?'ext':''}" style="padding-left:${ind*12}px">${dep?'<span class="br">└</span>':''}<img src="${icon(s)}" alt=""><div class="t"><b>${s.name}</b><span>${s.common} · ${BI[s.home]?BI[s.home].nm:''}</span></div><em>${tag}</em></div>`;
      (kids[s.id]||[]).sort((a,b)=>live(b)-live(a)).forEach(k=>node(k,dep+1));};
    for(const plan of ORDER){const roots=(kids[0]||[]).filter(s=>s.plan===plan);if(!roots.length)continue;
      out+=`<div class="grp">${PLANS[plan].nm}</div>`;roots.sort((a,b)=>live(b)-live(a)).forEach(s=>node(s,0));}
    B.innerHTML=`<p class="note">Cada bicho tiene una temperatura ideal en sus genes: si se va a un bioma más frío o más cálido gasta más energía, pero sus descendientes pueden adaptarse y acabar siendo otra especie.</p>`+out;
  }else if(tab==='diario'){
    B.innerHTML=st.log.slice().reverse().map(e=>`<div class="lg"><time>${fmtDate(e.t)}</time>${e.type==='nueva'?'✦ ':e.type==='extinta'?'† ':e.type==='llegada'?'➜ ':e.type==='carga'?'⚡ ':e.type==='tiempo'?'':'◆ '}${e.txt}</div>`).join('');
  }else{
    const c=CATS[WX.cat],lv=cfg.loc?cfg.loc.name:'sin ubicación',age=wxLive.ts?fmtDur((Date.now()-wxLive.ts)/1000):'—';
    B.innerHTML=`<div class="wx">${c.i} ${c.t} · ${Math.round(WX.temp)} °C · viento ${Math.round(WX.wind)} km/h</div>
      <p class="note">${cfg.mode==='auto'?`Tiempo real en <b>${lv}</b> (${wxLive.src}${wxLive.ts?', hace '+age:''}).`:'Modo manual: el tiempo real está desactivado.'}</p>
      <div class="grp">Tu ciudad</div>
      <div class="row"><input id="city" placeholder="p. ej. Leganés" value=""><button class="btn" id="citybtn" style="flex:0 0 90px">Buscar</button></div>
      <div class="grp">Modo</div>
      <div class="modes">${['auto','despejado','nublado','niebla','lluvia','tormenta','nieve'].map(m=>`<button class="btn ${cfg.mode===m?'on':''}" data-m="${m}">${m==='auto'?'🛰️ auto':CATS[m].i+' '+m}</button>`).join('')}</div>
      <div class="grp">Batería del submarino</div>
      <p class="note">${bat.real?`${Math.round(bat.level*100)} % · ${bat.charging?'cargando':'sin cargar'}`:'Este navegador no da la batería (se usa 85 %).'}${simCharge!=null?' · <b>carga simulada</b>':''}</p>
      <div class="row"><button class="btn" id="simc">${charging()?'Simular: desenchufar':'Simular: enchufar'}</button><button class="btn" id="simr">Usar la real</button></div>
      <p class="note">La batería del portátil es la del submarino: con poca, sus focos parpadean y sube a la superficie en modo ahorro. Al enchufar entra en <b>turbo</b>: va más rápido, echa chispas y suelta nutrientes que atraen a los bichos.<br><br>El tiempo afecta a la superficie: con <b>lluvia</b> los peces bajan, las gaviotas no cazan, los cangrejos se animan y llegan medusas; al parar florece el plancton. En <b>tormenta</b> hay corrientes y agua turbia en los primeros metros. El <b>frío</b> ralentiza y reduce el plancton. Las <b>nubes</b> y la <b>niebla</b> quitan luz.</p>`;
    B.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{cfg.mode=b.dataset.m;saveCfg();computeWX();if(cfg.mode==='auto')fetchWX().then(drawPanel);drawPanel();});
    $('#citybtn').onclick=async()=>{const q=$('#city').value.trim();if(!q)return;$('#citybtn').textContent='…';
      try{cfg.loc=await geocode(q);saveCfg();await fetchWX();}catch(e){$('#citybtn').textContent='No va';setTimeout(drawPanel,1500);return;}drawPanel();};
    $('#simc').onclick=()=>{simCharge=!charging();onCharge(simCharge);drawPanel();};
    $('#simr').onclick=()=>{simCharge=null;onCharge(bat.charging);drawPanel();};
  }
}
$('#tabs').addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.id==='close'){closePanel();return;}tab=t.dataset.t;drawPanel();});
$('#menuBtn').addEventListener('click',e=>{e.stopPropagation();openPanel();});

/* ================= toques ================= */
let down=null,lpT=null;
// en modo fondo el ratón no mueve nada: solo mantener pulsado (quieto) abre el panel
view.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,lx:e.clientX,ly:e.clientY,drag:false};lpT=NOPANEL?null:setTimeout(()=>{if(down&&!down.drag){down=null;openPanel();}},WALL?1000:650);});
view.addEventListener('pointermove',e=>{if(!down)return;if(!down.drag&&Math.hypot(e.clientX-down.x,e.clientY-down.y)>10){down.drag=true;clearTimeout(lpT);}
  if(down.drag&&!WALL){cam.x-=(e.clientX-down.lx)/S;cam.y-=(e.clientY-down.ly)/S;cam.manual=12;cam.x=clamp(cam.x,W/2,WORLD_W-W/2);cam.y=clamp(cam.y,TY0+H/2,WORLD_H-H/2-2);down.lx=e.clientX;down.ly=e.clientY;}});
view.addEventListener('pointerup',e=>{clearTimeout(lpT);if(!down)return;const d=down;down=null;if(d.drag||WALL)return;
  const wx=cam.x-W/2+MRG+e.clientX/S,wy=cam.y-H/2+MRG+e.clientY/S;
  let best=null,bd=9;for(const c of st.cr){const dd=Math.hypot(c.x-wx,c.y-wy)-c.g.size*.5;if(dd<bd){bd=dd;best=c;}}
  if(best){showScan(best);}
  else if(wy>0&&wy<floorAt(wx)){for(let i=0;i<7;i++)food.push({x:clamp(wx+R(-5,5),MINX,MAXX),y:wy+R(-2,2),k:'p',e:12,v:R(3,6),a:0});}
  $('#hint').style.opacity=0;toast.classList.remove('on');});
view.addEventListener('pointercancel',()=>{clearTimeout(lpT);down=null;});
addEventListener('wheel',e=>{if(WALL)return;cam.x=clamp(cam.x+(e.deltaX||e.deltaY)*.25,W/2,WORLD_W-W/2);cam.manual=10;},{passive:true});

/* ================= arranque ================= */
let DPR=1;
let bioT=0,bioN=-1;
function blit(){const k=S*DPR;vctx.imageSmoothingEnabled=false;vctx.drawImage(cv,0,0,W,H,Math.round((RX-(cam.x-W/2+MRG))*k),Math.round((RY-(cam.y-H/2+MRG))*k),W*k,H*k);
  // nombre del bioma al entrar en uno nuevo (sin interfaz)
  const bi=biomeIdx(sub.x);if(bi!==bioN){if(bioN>=0)bioT=performance.now();bioN=bi;}
  const a=(performance.now()-bioT)/1000;if(a<6){const al=Math.min(1,a/1,(6-a)/1.5)*.6,b=BIOMES[bi],fs=Math.round(13*DPR);
    vctx.save();vctx.globalAlpha=al;vctx.font=`${fs}px ui-monospace,"Courier New",monospace`;vctx.textAlign='center';vctx.fillStyle='rgba(0,0,0,.6)';
    const tx=b.nm.toUpperCase().split('').join(' '),y=view.height*.86;vctx.fillText(tx,view.width/2+DPR,y+DPR);vctx.fillStyle='#e8f4ef';vctx.fillText(tx,view.width/2,y);
    vctx.font=`${Math.round(10*DPR)}px ui-monospace,"Courier New",monospace`;vctx.fillStyle='rgba(232,244,239,.8)';vctx.fillText(`${Math.round(b.floor*2.2)} m de fondo · ${toC(b.temp)} °C`,view.width/2,y+fs*1.4);vctx.restore();}
  if(wxMsg){const a2=(performance.now()-wxMsg.t)/1000;if(a2>8)wxMsg=null;else{const al=Math.min(1,a2,(8-a2)/1.5)*.65,fs=Math.round(12*DPR);vctx.save();vctx.globalAlpha=al;vctx.font=`${fs}px ui-monospace,"Courier New",monospace`;vctx.textAlign='center';
    const tx=`${CATS[WX.cat].i}  ${wxMsg.txt}`,y=view.height*.12;vctx.fillStyle='rgba(0,0,0,.6)';vctx.fillText(tx,view.width/2+DPR,y+DPR);vctx.fillStyle='#e8f4ef';vctx.fillText(tx,view.width/2,y);vctx.restore();}}}
function resize(){
  S=clamp(Math.round(Math.min(innerWidth,innerHeight)/250),2,6);
  W=Math.ceil(innerWidth/S)+2*MRG;H=Math.ceil(innerHeight/S)+2*MRG;cv.width=W;cv.height=H;ctx.imageSmoothingEnabled=false;snowP=[];
  DPR=window.devicePixelRatio||1;view.width=Math.round(innerWidth*DPR);view.height=Math.round(innerHeight*DPR);vctx.imageSmoothingEnabled=false;
}
resize();addEventListener('resize',resize);
const fresh=!load();
if(fresh){const now=Date.now();st={created:now,t:now,seen:now,nextId:1,nextSp:1,cr:[],sp:[],fossils:[],log:[],corpses:[],stats:{births:0,deaths:0,eaten:0,maxGen:0,genMark:0},snap:{births:0,deaths:0},arr:0,chk:0,firsts:{}};}
season(Date.now());buildPlants();buildTerrain();
if(fresh)seedWorld();else{st.cr.forEach(c=>{c.dead=false;c.atDen=false;c.den=null;});}
initSub();
if(!fresh)queueCatchUp(st.t,Date.now());
let PAUSED=false;window.__pause=b=>{PAUSED=!!b;if(!PAUSED)lastFrame=0;else save();};
let lastBlit=0;let simNow=Date.now(),lastSave=0,lastFrame=0,lastHud=0,lastMap=0;
function loop(ts){
  requestAnimationFrame(loop);
  const minGap=charging()?33:(bat.real&&bat.level<.2)?66:bat.real?42:33;
  if(PAUSED)return;
  if(ts-lastFrame<minGap-2){
    // fotograma intermedio: solo la cámara (barato) para que el desplazamiento vaya fluido
    const gap=charging()||!bat.real?15:(bat.level<.2?1e9:20);
    if(lastFrame&&ts-lastBlit>=gap-2){const d=Math.min(.05,(ts-lastBlit)/1000);lastBlit=ts;updateCam(d);blit();}
    return;
  }
  const fdt=Math.min(.1,lastFrame?(ts-lastFrame)/1000:1/30);lastFrame=ts;
  const now=Date.now();
  if(catchQ)runCatchUp();
  else{const dt=(now-simNow)/1000;if(dt>3)queueCatchUp(simNow,now);else if(dt>0)step(Math.min(dt,.12),now);}
  simNow=now;window.__beat=now;
  updateSub(fdt);updateCam(Math.min(.05,lastBlit?(ts-lastBlit)/1000:fdt));lastBlit=ts;
  render(now,fdt);blit();
  if(now-lastHud>500){lastHud=now;updHUD();}
  if(now-lastMap>1000){lastMap=now;drawMap();}
  if(rebuildCorals){rebuildCorals=false;buildTerrain();}
  if(now-lastSave>15000){lastSave=now;save();}
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)save();
  else{const now=Date.now();if(!catchQ&&now-simNow>3000){queueCatchUp(simNow,now);simNow=now;}else showSummary();}
});
addEventListener('pagehide',save);
setTimeout(()=>{$('#hint').style.opacity=0;},9000);
window.__save=save;
if(/ajustes/.test(location.hash))setTimeout(()=>{toast.classList.remove('on');openPanel();},600);
window.__setBattery=(l,c)=>{bat.level=clamp(+l,0,1);bat.charging=!!c;bat.real=true;onCharge(charging());};
initLoc();
if(fresh){toast.innerHTML='<h3>Empieza la expedición</h3><div class="l">El submarino recorre un mar con ocho biomas, del manglar a la fosa abisal y el hielo polar. Cada uno tiene su fauna y evoluciona por su cuenta. Toca un bicho para escanearlo.</div>';toast.classList.add('on');toastT=setTimeout(()=>toast.classList.remove('on'),8000);}
requestAnimationFrame(loop);
})();
</script>
